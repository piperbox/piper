name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # goreleaser pushes the piper-relay container image to ghcr (#483).
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      # Dockerfile.relay is copy-only (no RUN), but the arm64 image build and
      # the multi-arch manifest push still want a buildx builder + QEMU.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Force the tag that triggered the run. goreleaser otherwise resolves
          # the "current" tag via git describe, which is ambiguous when a final
          # release and its RC point at the same commit (v0.2.1 + v0.2.1-rc.2) —
          # it then rebuilt the RC and collided with its existing assets.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Publish to apt repo
        # Stable tags only: RCs carry a -suffix and never reach apt.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: |
          gh api repos/piperbox/apt/dispatches \
            -f event_type=publish \
            -f 'client_payload[tag]=${{ github.ref_name }}'
