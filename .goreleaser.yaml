version: 2

project_name: piper

builds:
  - id: piperd
    main: ./cmd/piperd
    binary: piperd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w -X github.com/piperbox/piper/internal/version.value={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: piper
    main: ./cmd/piper
    binary: piper
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w -X github.com/piperbox/piper/internal/version.value={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: piper-relay
    main: ./cmd/piper-relay
    binary: piper-relay
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w -X github.com/piperbox/piper/internal/version.value={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: piperd
    ids: [piperd]
    name_template: "piperd_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
  - id: piper
    ids: [piper]
    name_template: "piper_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
  - id: piper-relay
    ids: [piper-relay]
    name_template: "piper-relay_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
  - id: piper-bundle
    ids: [piper, piperd]
    name_template: "piper-bundle_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

nfpms:
  - id: piperd
    ids: [piperd]
    package_name: piperd
    # ConventionalFileName is what maps GOARM=7 → armhf and drops the _linux_
    # infix; the default template would name this piperd_<ver>_linux_armv7.deb
    # and silently break the apt pipeline's filename parsing.
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb]
    bindir: /usr/bin
    vendor: piperbox
    homepage: https://github.com/piperbox/piper
    maintainer: piperbox maintainers <noreply@piperbox.dev>
    description: Piper agent — git push to a live HTTPS URL on your own box.
    license: Apache-2.0
    section: net
    contents:
      - src: packaging/deb/piperd.service
        dst: /usr/lib/systemd/system/piperd.service
      - src: packaging/systemd/piperd.env.example
        dst: /etc/piper/piperd.env
        type: config
        file_info:
          mode: 0600
    scripts:
      postinstall: packaging/deb/postinstall.sh
      preremove: packaging/deb/preremove.sh
  - id: piper
    ids: [piper]
    package_name: piper
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb]
    bindir: /usr/bin
    vendor: piperbox
    homepage: https://github.com/piperbox/piper
    maintainer: piperbox maintainers <noreply@piperbox.dev>
    description: Piper CLI — drive piperd locally, over the LAN, or through the relay.
    license: Apache-2.0
    section: net

# `brews` is deprecated in favor of homebrew_casks, but casks cannot declare
# `brew services` blocks — a formula with a `service do` block is the whole
# point, so the deprecation warning is accepted deliberately (spec 2026-07-30).
brews:
  - name: piper
    ids: [piper-bundle]
    repository:
      owner: piperbox
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/piperbox/piper
    description: "Git push -> live HTTPS URL on hardware you own"
    license: Apache-2.0
    # auto: prerelease (RC) tags never touch the tap.
    skip_upload: auto
    install: |
      bin.install "piper"
      bin.install "piperd"
    caveats: |
      Run the Piper agent now and at every login:
        brew services start piper
      Boot-durable instead (headless Macs, runs as root):
        sudo brew services start piper
      brew upgrade does NOT restart a running agent — after upgrading run:
        brew services restart piper
    # ENV["HOME"] is evaluated when `brew services` generates the plist, as the invoking user — so the user-level service gets ~/.piper/piperd
    # (exactly config.DefaultDataDir(), keeping piper connect's relay.json where piperd reads it, and preserving data from pre-brew macOS installs),
    # and sudo brew services gets /var/root/.piper/piperd (deterministic, self-consistent). The XDG pair relocates embedded-Caddy/certmagic
    # state to the same place, matching the old LaunchAgent's behavior.
    service: |
      run [opt_bin/"piperd"]
      keep_alive true
      log_path var/"log/piperd.log"
      error_log_path var/"log/piperd.err.log"
      data_dir = "#{Dir.home}/.piper/piperd"
      environment_variables PIPER_DATA_DIR: data_dir, XDG_DATA_HOME: data_dir, XDG_CONFIG_HOME: data_dir
    test: |
      assert_match version.to_s, shell_output("#{bin}/piper --version")

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  # rc/beta/alpha tags publish as pre-releases; a clean vX.Y.Z is the Latest release.
  prerelease: auto
  extra_files:
    - glob: packaging/systemd/piper-relay.service
    - glob: packaging/systemd/piperd.service
    - glob: install.sh
