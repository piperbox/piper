# piper-edge + N piper-relay + Postgres on one host that owns a public IP (the
# hosted relay's Hetzner layout). Documented in docs/runbooks/relay-deploy.md,
# "Scale out".
#
# The edge owns the public ports (:443/:80/:7000) on the host network and
# routes each connection to the relay that owns the agent's tunnel, adding a
# PROXY v2 header so relays still see real client IPs. Relays run on the
# bridge network with no published ports (reachable only through the edge)
# and scale with `docker compose up -d --scale relay=N`. Host networking has
# no compose service DNS, so Postgres publishes on the host loopback for the
# edge; relays reach it by service name.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: piper_relay
      POSTGRES_DB: piper_relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env next to this file}
    ports:
      - "127.0.0.1:5432:5432"   # loopback only: the host-networked edge, psql, pg_dump
    volumes:
      - relay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piper_relay -d piper_relay"]
      interval: 5s
      timeout: 3s
      retries: 10

  edge:
    image: ghcr.io/piperbox/piper-edge:${PIPER_EDGE_VERSION:?set PIPER_EDGE_VERSION in .env (e.g. 0.20.0)}
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PIPER_EDGE_DB_URL: postgres://piper_relay:${POSTGRES_PASSWORD}@127.0.0.1:5432/piper_relay
      PIPER_EDGE_APEX: public.getpiper.dev
      # Ops endpoint on the host loopback, where `tailscale serve` exposes it
      # (the same 127.0.0.1:9090 the single relay used to hold).
      PIPER_EDGE_METRICS: "1"
      PIPER_EDGE_LOGS: "1"

  relay:
    image: ghcr.io/piperbox/piper-relay:${PIPER_RELAY_VERSION:?set PIPER_RELAY_VERSION in .env (e.g. 0.20.0)}
    restart: unless-stopped
    # SIGTERM drains (#523): up to 20s for open streams, 5s to leave the pool,
    # 35s for webhook deliveries to park. Compose's default 10s would SIGKILL
    # the relay mid-drain.
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    # Carries the GitHub App vars, PIPER_RELAY_TLS_CERT/KEY and
    # PIPER_RELAY_GITHUB_APP_KEY pointing at the in-container paths mounted
    # below. The values overridden here are the ones that differ on the bridge.
    env_file: /etc/piper-relay.env
    environment:
      PIPER_RELAY_DB_URL: postgres://piper_relay:${POSTGRES_PASSWORD}@postgres:5432/piper_relay
      # Every connection arrives from the edge with a PROXY v2 header.
      PIPER_RELAY_PROXY_PROTOCOL: "1"
      # The control hop between relays dials :8080 on the bridge; the env file
      # pins it to loopback for the old host-networked layout.
      PIPER_RELAY_API_ADDR: ":8080"
      # Per-replica ops endpoint on the container IP:
      #   curl http://$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' piper-relay-relay-1):9090/logs
      PIPER_RELAY_OPS_ADDR: ":9090"
      # PIPER_RELAY_ADVERTISE_HOST is left unset: the default (first
      # non-loopback IPv4 = the container's bridge IP) is what the edge dials.
    volumes:
      # Whole tree, not live/<domain>: certbot's live/ entries are symlinks into
      # ../../archive/, which dangle if only live/ is mounted. The relay re-reads
      # the pair on every handshake (#497), so renewals need no restart.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # 0600, root-owned; the relay refuses a world-readable key.
      - /etc/piper-relay/github-app.pem:/etc/piper-relay/github-app.pem:ro

volumes:
  relay_pg:
